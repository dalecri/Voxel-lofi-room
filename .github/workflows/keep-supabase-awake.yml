# Free Supabase projects pause after about a week without activity, and short share
# links stop opening while paused. Twice a week this looks up one short link in the
# lofi-rooms project (a read; nothing is stored), which keeps it awake.
# If the project ever does pause, this job fails, so GitHub emails you: restore it
# from the Supabase dashboard. Sharing keeps working meanwhile with full links.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 * * 1,4'   # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Look up a short link
        env:
          # The same publishable key the app ships with: it can only call the two link functions.
          URL: https://smomqbsnesomcbdzjzsx.supabase.co/rest/v1/rpc/room_link
          KEY: sb_publishable_8aheKvc-sYfXvn9dHf-RBA_FFHBuK78
        run: |
          status=$(curl -sS -o body.json -w '%{http_code}' --retry 3 --retry-delay 20 --max-time 30 \
            -X POST "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' -d '{"p_id":"00000000"}')
          echo "HTTP $status: $(cat body.json)"
          test "$status" = 200
