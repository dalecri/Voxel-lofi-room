<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Lofi Room</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #121212; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        .glass {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }
        .icon-btn {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
        .icon-btn.active {
            background: #a78bfa;
            border-color: #c4b5fd;
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.4);
        }
    </style>
</head>
<body>

    <div id="ui" class="absolute bottom-8 left-1/2 -translate-x-1/2 z-10 p-4 glass text-white flex flex-col items-center gap-3 select-none">
        <div class="flex gap-3">
            <button id="toggle-ceiling" class="icon-btn active" title="Ceiling Light">💡</button>
            <button id="toggle-lamp" class="icon-btn active" title="Desk Lamp">🔦</button>
            <button id="toggle-window" class="icon-btn active" title="Window Glow">🌅</button>
            <button id="toggle-blinds" class="icon-btn active" title="Toggle Blinds">🪟</button>
        </div>
        <p class="text-[10px] uppercase tracking-widest opacity-40 font-bold">Lofi Environment Controls</p>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let ceilingLight, deskLamp, windowLight;
        let lampMesh, monitorMesh, windowMesh, blindsGroup;
        let blindsOpen = false;

        const COLORS = {
            wall: 0xeeeeee,
            floor: 0xcccccc,
            wood: 0x8d6e63,
            leaf: 0x66bb6a,
            pot: 0xff8a65,
            screen: 0x81d4fa,
            lamp: 0xffca28,
            keyboard: 0x424242,
            rug: 0xab47bc,
            art: [0xef5350, 0x42a5f5, 0xffca28]
        };

        window.onload = function() {
            init();
            buildRoom();
            animate();
            setupInteractions();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 12, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2.1;
            controls.target.set(0, 2, 0);

            // Subtle Ambient
            scene.add(new THREE.AmbientLight(0xffffff, 0.15));

            // Lights
            ceilingLight = new THREE.PointLight(0xffffff, 0.7, 25);
            ceilingLight.position.set(0, 7, 0);
            ceilingLight.castShadow = true;
            scene.add(ceilingLight);

            deskLamp = new THREE.PointLight(0xffaa66, 1.5, 10);
            deskLamp.position.set(-3.5, 3.2, -3.5);
            deskLamp.castShadow = true;
            scene.add(deskLamp);

            windowLight = new THREE.PointLight(0x88ccff, 1.8, 15);
            windowLight.position.set(6, 4, 0);
            scene.add(windowLight);
        }

        function createVoxel(x, y, z, color = 0xffffff, size = 1, emissive = 0) {
            const geometry = new THREE.BoxGeometry(size, size, size);
            const material = new THREE.MeshStandardMaterial({ 
                color: color,
                emissive: color,
                emissiveIntensity: emissive
            });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, y, z);
            cube.castShadow = true;
            cube.receiveShadow = true;
            return cube;
        }

        function buildRoom() {
            const roomGroup = new THREE.Group();

            // Floor
            for(let x = -5; x <= 5; x++) {
                for(let z = -5; z <= 5; z++) {
                    const isRug = (Math.abs(x) <= 2 && Math.abs(z) <= 2);
                    roomGroup.add(createVoxel(x, 0, z, isRug ? COLORS.rug : COLORS.floor));
                }
            }

            // Walls
            for(let i = 1; i <= 8; i++) {
                for(let j = -5; j <= 5; j++) {
                    // Back Wall (with new Window B)
                    const isWindowB = (i >= 4 && i <= 6 && j >= -3 && j <= -1);
                    if (!isWindowB) {
                        roomGroup.add(createVoxel(j, i, -5.5, COLORS.wall));
                    }
                    
                    // Left Wall (Window A)
                    const isWindowA = (i >= 4 && i <= 6 && j >= 0 && j <= 3);
                    if (!isWindowA) {
                        roomGroup.add(createVoxel(5.5, i, j, COLORS.wall));
                    }
                }
            }

            // Painting above bed
            roomGroup.add(createVoxel(0, 5, -5.4, COLORS.art[0], 0.8));
            roomGroup.add(createVoxel(1, 5, -5.4, COLORS.art[1], 0.8));
            roomGroup.add(createVoxel(0, 4, -5.4, COLORS.art[2], 0.8));

            // Desk Setup
            for(let x = -4.5; x <= -2.5; x++) {
                for(let z = -4.5; z <= -1.5; z++) {
                    roomGroup.add(createVoxel(x, 2.5, z, COLORS.wood));
                }
            }
            // Desk legs
            const legs = [[-4.5, -4.5], [-2.5, -4.5], [-4.5, -1.5], [-2.5, -1.5]];
            legs.forEach(p => roomGroup.add(createVoxel(p[0], 1.25, p[1], COLORS.wood, 0.5)));

            // Monitor
            const monitorMat = new THREE.MeshStandardMaterial({ color: COLORS.screen, emissive: COLORS.screen, emissiveIntensity: 0.5 });
            monitorMesh = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1, 0.1), monitorMat);
            monitorMesh.position.set(-3.5, 3.5, -4.4);
            roomGroup.add(monitorMesh);

            // Lamp
            const lampHead = createVoxel(-3.5, 3.5, -2, COLORS.lamp, 0.4, 1);
            lampMesh = lampHead;
            roomGroup.add(lampHead);

            // Bed
            for(let x = -1; x <= 4; x++) {
                for(let z = -5; z <= -3; z++) {
                    roomGroup.add(createVoxel(x, 1, z, 0x5c6bc0));
                }
            }

            // Fixed Cactus (on floor)
            roomGroup.add(createVoxel(4, 0.8, 4, COLORS.pot, 0.6));
            roomGroup.add(createVoxel(4, 1.3, 4, COLORS.leaf, 0.5));

            // Hanging Plant
            roomGroup.add(createVoxel(5.2, 7, 4.5, COLORS.pot, 0.4));
            roomGroup.add(createVoxel(5.2, 6.5, 4.5, COLORS.leaf, 0.3));
            roomGroup.add(createVoxel(5.2, 6.2, 4.5, COLORS.leaf, 0.2));

            // Main Window Glow
            const winMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, emissive: 0x88ccff, emissiveIntensity: 0.8, transparent: true, opacity: 0.4 });
            windowMesh = new THREE.Mesh(new THREE.BoxGeometry(0.1, 3, 4), winMat);
            windowMesh.position.set(5.5, 5, 1.5);
            roomGroup.add(windowMesh);

            // Blinds for Back Window
            blindsGroup = new THREE.Group();
            for(let k = 0; k < 5; k++) {
                const slat = createVoxel(-2, 6.3 - (k * 0.6), -5.2, 0x444444, 1);
                slat.scale.set(2.5, 0.2, 0.1);
                blindsGroup.add(slat);
            }
            roomGroup.add(blindsGroup);

            scene.add(roomGroup);
        }

        function setupInteractions() {
            const btns = {
                ceiling: document.getElementById('toggle-ceiling'),
                lamp: document.getElementById('toggle-lamp'),
                window: document.getElementById('toggle-window'),
                blinds: document.getElementById('toggle-blinds')
            };

            btns.ceiling.onclick = () => {
                ceilingLight.visible = !ceilingLight.visible;
                btns.ceiling.classList.toggle('active', ceilingLight.visible);
            };

            btns.lamp.onclick = () => {
                deskLamp.visible = !deskLamp.visible;
                lampMesh.material.emissiveIntensity = deskLamp.visible ? 1 : 0;
                monitorMesh.material.emissiveIntensity = deskLamp.visible ? 0.5 : 0.05;
                btns.lamp.classList.toggle('active', deskLamp.visible);
            };

            btns.window.onclick = () => {
                windowLight.visible = !windowLight.visible;
                windowMesh.material.emissiveIntensity = windowLight.visible ? 0.8 : 0;
                btns.window.classList.toggle('active', windowLight.visible);
            };

            btns.blinds.onclick = () => {
                blindsOpen = !blindsOpen;
                btns.blinds.classList.toggle('active', !blindsOpen);
                // Simple animation trigger in the loop or direct jump
                blindsGroup.visible = !blindsOpen;
            };
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.onresize = function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
